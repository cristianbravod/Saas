<div class="container">
  <h2>{{ isEditMode ? 'Editar' : 'Nuevo' }} Restaurante</h2>
  <form [formGroup]="restaurantForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" formControlName="name" class="form-control">
    </div>
    <div class="form-group">
      <label for="slug">Slug</label>
      <input type="text" id="slug" formControlName="slug" class="form-control">
    </div>
    <div class="form-group">
      <label for="logo_path">Logo</label>
      <input type="text" id="logo_path" formControlName="logo_path" class="form-control">
    </div>
    <div class="form-group">
      <label for="primary_color">Color Primario</label>
      <input type="text" id="primary_color" formControlName="primary_color" class="form-control">
    </div>
    <div class="form-group">
      <label for="secondary_color">Color Secundario</label>
      <input type="text" id="secondary_color" formControlName="secondary_color" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>
