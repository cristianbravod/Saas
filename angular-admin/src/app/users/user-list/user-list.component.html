<div class="container">
  <h2>Usuarios</h2>
  <a routerLink="/users/new" class="btn btn-primary">Nuevo Usuario</a>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <a [routerLink]="['/users/edit', user.id]" class="btn btn-secondary">Editar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
